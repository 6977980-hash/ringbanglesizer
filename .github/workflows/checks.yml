# Audit 2026-11-07 F-D01: lint every PHP file and run the tool test cases on each PR and push to main.
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: npm install --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Tool tests
        run: php tools/tests/build-harness.php && node tools/tests/tool-tests.js
